name: Build EssGuard

on:
  push:
    branches: [ "paper-1.21.4-audit" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn --batch-mode clean package
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: EssGuard-1.21.4
          path: target/EssGuard-1.21.4.jar
          if-no-files-found: error
